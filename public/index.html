<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Accelerated Jam Tracks</title>
    <meta name="description" content="Accelerated Jam Tracks — progressive-tempo jam tracks for guitar. Backing tracks that speed up as you play." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Accelerated Jam Tracks" />
    <meta property="og:title" content="Accelerated Jam Tracks" />
    <meta property="og:description" content="Progressive-tempo jam tracks for guitar." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <h1 class="masthead">
        <img
          class="logo"
          src="/ajt-logo.png"
          width="854"
          height="737"
          alt="Accelerated Jam Tracks"
        />
      </h1>

      <section aria-labelledby="jam-tracks-heading">
        <div class="section-head">
          <h2 id="jam-tracks-heading">Jam Tracks</h2>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <footer class="social" id="social">
        <a
          href="https://www.youtube.com/@acceleratedjamtracks"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Accelerated Jam Tracks on YouTube"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23.5 6.2a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.51A3.02 3.02 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.12 2.14c1.88.51 9.38.51 9.38.51s7.5 0 9.38-.51a3.02 3.02 0 0 0 2.12-2.14A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.57V8.43L15.82 12 9.6 15.57Z" />
          </svg>
        </a>
        <a
          href="https://www.instagram.com/acceleratedjamtracks/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Accelerated Jam Tracks on Instagram"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.42.56.21.96.47 1.38.9.43.42.69.82.9 1.38.17.43.37 1.06.42 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.42 2.23-.21.56-.47.96-.9 1.38-.42.43-.82.69-1.38.9-.43.17-1.06.37-2.23.42-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.42a3.72 3.72 0 0 1-1.38-.9 3.72 3.72 0 0 1-.9-1.38c-.17-.43-.37-1.06-.42-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.42-2.23.21-.56.47-.96.9-1.38.42-.43.82-.69 1.38-.9.43-.17 1.06-.37 2.23-.42C8.42 2.17 8.8 2.16 12 2.16Zm0 1.44c-3.14 0-3.51.01-4.75.07-.9.04-1.39.19-1.71.32-.43.17-.74.37-1.06.69-.32.32-.52.63-.69 1.06-.13.32-.28.81-.32 1.71-.06 1.24-.07 1.61-.07 4.75s.01 3.51.07 4.75c.04.9.19 1.39.32 1.71.17.43.37.74.69 1.06.32.32.63.52 1.06.69.32.13.81.28 1.71.32 1.24.06 1.61.07 4.75.07s3.51-.01 4.75-.07c.9-.04 1.39-.19 1.71-.32.43-.17.74-.37 1.06-.69.32-.32.52-.63.69-1.06.13-.32.28-.81.32-1.71.06-1.24.07-1.61.07-4.75s-.01-3.51-.07-4.75c-.04-.9-.19-1.39-.32-1.71a2.86 2.86 0 0 0-.69-1.06 2.86 2.86 0 0 0-1.06-.69c-.32-.13-.81-.28-1.71-.32-1.24-.06-1.61-.07-4.75-.07Zm0 2.45a5.95 5.95 0 1 1 0 11.9 5.95 5.95 0 0 1 0-11.9Zm0 1.44a4.51 4.51 0 1 0 0 9.02 4.51 4.51 0 0 0 0-9.02Zm6.32-.35a1.39 1.39 0 1 1-2.78 0 1.39 1.39 0 0 1 2.78 0Z" />
          </svg>
        </a>
      </footer>
    </div>

    <script>
      (function () {
        "use strict";

        var grid = document.getElementById("grid");

        function extractId(url) {
          if (!url) return "";
          try {
            var u = new URL(url);
            if (u.hostname.indexOf("youtu.be") !== -1) {
              return u.pathname.slice(1).split("/")[0];
            }
            var v = u.searchParams.get("v");
            if (v) return v;
            var parts = u.pathname.split("/").filter(Boolean);
            for (var i = 0; i < parts.length; i++) {
              if (
                (parts[i] === "shorts" ||
                  parts[i] === "embed" ||
                  parts[i] === "v") &&
                parts[i + 1]
              ) {
                return parts[i + 1];
              }
            }
            return "";
          } catch (e) {
            return "";
          }
        }

        function sortVideos(list) {
          var hasOrder = list.some(function (v) {
            return typeof v.sortOrder === "number";
          });
          return list.slice().sort(function (a, b) {
            if (hasOrder) {
              var ao = typeof a.sortOrder === "number" ? a.sortOrder : Infinity;
              var bo = typeof b.sortOrder === "number" ? b.sortOrder : Infinity;
              return ao - bo;
            }
            var ad = a.publishedAt ? new Date(a.publishedAt).getTime() : 0;
            var bd = b.publishedAt ? new Date(b.publishedAt).getTime() : 0;
            return bd - ad; // newest first
          });
        }

        var PLAY_SVG =
          '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

        function makeCard(v) {
          var id = extractId(v.youtubeUrl);
          var card = document.createElement("a");
          card.className = "card";
          card.href = v.youtubeUrl || "#";
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.setAttribute(
            "aria-label",
            (v.title ? "Watch " + v.title : "Watch video") + " on YouTube"
          );

          var thumb = document.createElement("div");
          thumb.className = "thumb";

          var img = document.createElement("img");
          img.loading = "lazy";
          img.decoding = "async";
          img.width = 1280;
          img.height = 720;
          img.alt = v.title || "";
          var primary =
            v.thumbnailUrl ||
            (id ? "https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg" : "");
          img.addEventListener("error", function onErr() {
            img.removeEventListener("error", onErr);
            if (id) {
              img.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
            }
          });
          if (primary) img.src = primary;

          var play = document.createElement("span");
          play.className = "play";
          play.setAttribute("aria-hidden", "true");
          play.innerHTML = PLAY_SVG;

          thumb.appendChild(img);
          thumb.appendChild(play);

          var meta = document.createElement("div");
          meta.className = "meta";
          var title = document.createElement("h3");
          title.className = "title";
          title.textContent = v.title || "Untitled";
          meta.appendChild(title);
          if (v.tempoText) {
            var tempo = document.createElement("p");
            tempo.className = "tempo";
            tempo.textContent = v.tempoText;
            meta.appendChild(tempo);
          }

          card.appendChild(thumb);
          card.appendChild(meta);
          return card;
        }

        function render(videos) {
          grid.textContent = "";
          if (!Array.isArray(videos) || videos.length === 0) {
            var p = document.createElement("p");
            p.className = "empty";
            p.textContent = "New jam tracks coming soon.";
            grid.appendChild(p);
            return;
          }
          var frag = document.createDocumentFragment();
          sortVideos(videos).forEach(function (v) {
            frag.appendChild(makeCard(v));
          });
          grid.appendChild(frag);
        }

        fetch("videos.json", { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(render)
          .catch(function () {
            render([]);
          });
      })();
    </script>
  </body>
</html>
